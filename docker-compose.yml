services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proposal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-proposal_generator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-proposal}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-proposal_generator}
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      APP_BASE_URL: http://localhost:3000
      PROPOSAL_WORKSPACE_ID: development-workspace
      PROPOSAL_API_KEY: ""
      TRUST_PROXY_HEADERS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-proposal}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-proposal_generator}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      GENERATION_MODE: deterministic
      RATE_LIMIT_REQUESTS_PER_MINUTE: 20
      HUMAN_APPROVAL_REQUIRED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
