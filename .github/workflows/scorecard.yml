name: OpenSSF Scorecard

on:
  branch_protection_rule:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download pinned Scorecard CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output scorecard.tar.gz \
            https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
          echo '83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  scorecard.tar.gz' | sha256sum --check --strict
          tar -xzf scorecard.tar.gz scorecard
          chmod +x scorecard
      - name: Run OpenSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scorecard --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
      - name: Show Scorecard result
        run: cat scorecard.json
      - name: Upload Scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard
          path: scorecard.json
          if-no-files-found: error
