name: CI

on:
  push:
    branches: [main, production-hardening-persistence-20260726]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, migrate, test, build and E2E
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: proposal
          POSTGRES_PASSWORD: proposal-ci-only
          POSTGRES_DB: proposal_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proposal -d proposal_generator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      PROPOSAL_API_KEY: test-proposal-api-key-at-least-32-characters
      PROPOSAL_WORKSPACE_ID: test-workspace
      TRUST_PROXY_HEADERS: "false"
      DATABASE_URL: postgresql://proposal:proposal-ci-only@localhost:5432/proposal_generator
      DATABASE_SSL: "false"
      REDIS_URL: redis://localhost:6379/0
      GENERATION_MODE: deterministic
      RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
      HUMAN_APPROVAL_REQUIRED: "true"
      OPENAI_TIMEOUT_MS: "5000"
      OPENAI_MAX_RETRIES: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.15.1"
      - name: Generate isolated lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install generated locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Build production application
        env:
          NODE_ENV: production
          APP_BASE_URL: https://ci.proposal.invalid
          TRUST_PROXY_HEADERS: "true"
        run: npm run build
      - name: Audit dependency graph
        run: npm audit --audit-level=high
      - name: Scan tracked files for high-confidence secrets
        run: npm run security:secrets
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Basic persistence and approval E2E
        run: npm run test:e2e
      - name: Upload coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-generator-test-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Enforce source-controlled lockfile
        run: git ls-files --error-unmatch package-lock.json

  codeql:
    name: CodeQL
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  container:
    name: Compose, image build and vulnerability scan
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.15.1"
      - name: Generate isolated lockfile for image build
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --pull --target runner -t proposal-generator:${{ github.sha }} .
      - name: Scan application image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: proposal-generator:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Enforce source-controlled lockfile
        run: git ls-files --error-unmatch package-lock.json
