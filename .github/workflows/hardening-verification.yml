name: Hardening verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      PROPOSAL_API_KEY: test-proposal-api-key-at-least-32-characters
      PROPOSAL_WORKSPACE_ID: test-workspace
      TRUST_PROXY_HEADERS: 'false'
      GENERATION_MODE: deterministic
      RATE_LIMIT_REQUESTS_PER_MINUTE: '1000'
      HUMAN_APPROVAL_REQUIRED: 'true'
      OPENAI_TIMEOUT_MS: '5000'
      OPENAI_MAX_RETRIES: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Production build
        env:
          NODE_ENV: production
          APP_BASE_URL: https://ci.proposal.invalid
          TRUST_PROXY_HEADERS: 'true'
        run: npm run build
      - name: OpenNext Cloudflare build and deployment dry run
        run: |
          npm run cf:build
          npm run cf-typegen
          git diff --exit-code -- cloudflare-env.d.ts
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - run: npm audit --audit-level=high
      - name: Secret scan
        run: |
          if git grep -n -I -E '(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- ':!package-lock.json'; then
            echo "Potential committed secret detected"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Playwright against workerd preview
        run: |
          npx opennextjs-cloudflare preview --port 8787 > wrangler-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8787 PLAYWRIGHT_SKIP_WEBSERVER=1 npm run test:e2e
      - run: git ls-files --error-unmatch package-lock.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-generator-hardening-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            wrangler-preview.log
          if-no-files-found: warn

  codeql:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  container:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.17.1'
          package-manager-cache: false
      - run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: docker compose config --quiet
      - run: docker build --pull --target runner -t proposal-generator:${{ github.sha }} .
      - name: Scan application image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: proposal-generator:${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-generator-trivy-report
          path: trivy-report.txt
          if-no-files-found: error
      - name: Enforce image scan result
        if: steps.trivy.outcome != 'success'
        run: exit 1
