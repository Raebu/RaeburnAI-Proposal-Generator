name: Hardening verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: proposal
          POSTGRES_PASSWORD: proposal-ci-only
          POSTGRES_DB: proposal_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proposal -d proposal_generator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      PROPOSAL_API_KEY: test-proposal-api-key-at-least-32-characters
      PROPOSAL_WORKSPACE_ID: test-workspace
      TRUST_PROXY_HEADERS: "false"
      DATABASE_URL: postgresql://proposal:proposal-ci-only@localhost:5432/proposal_generator
      DATABASE_SSL: "false"
      REDIS_URL: redis://localhost:6379/0
      GENERATION_MODE: deterministic
      RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
      HUMAN_APPROVAL_REQUIRED: "true"
      OPENAI_TIMEOUT_MS: "5000"
      OPENAI_MAX_RETRIES: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.17.1"
          package-manager-cache: false
      - name: Generate and commit lockfile without dependency scripts
        run: |
          if test ! -f package-lock.json; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock npm dependency graph for reproducible builds"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Production build
        env:
          NODE_ENV: production
          APP_BASE_URL: https://ci.proposal.invalid
          TRUST_PROXY_HEADERS: "true"
        run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run security:secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: git ls-files --error-unmatch package-lock.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-generator-hardening-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn

  codeql:
    if: github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  container:
    if: github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.17.1"
          package-manager-cache: false
      - run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: docker compose config --quiet
      - run: docker build --pull --target runner -t proposal-generator:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: proposal-generator:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
